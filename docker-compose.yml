# =============================================================================
#  Patrimonio Inmuebles
# =============================================================================
#      docker compose up -d --build
#
#  y el sitio queda en http://localhost:3001 — el panel, en /admin.
#
#  Un solo servicio: la base es un archivo SQLite que vive en un volumen, no
#  un motor aparte. Es lo que corresponde al tamano de esta empresa, y esta
#  justificado en el README.
# =============================================================================

services:
  sitio:
    build:
      context: .
      dockerfile: Dockerfile
    image: patrimonio/sitio:1.0.0
    container_name: patrimonio-sitio
    restart: unless-stopped

    environment:
      PORT: "3001"
      #  El primer usuario del panel, si la base no tiene ninguno. La clave y la
      #  llave de cifrado no tienen valor por omision (seria publico): salen del
      #  .env que crea preparar-env.ps1, y sin el compose se detiene.
      ADMIN_CORREO: ${ADMIN_CORREO:-admin@patrimonioinmuebles.cl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD en el .env (crealo con preparar-env.ps1)}
      #  Cifra la clave de la agencia y el secreto de sus avisos en la base.
      CIFRADO_LLAVE: ${CIFRADO_LLAVE:?Falta CIFRADO_LLAVE en el .env (crealo con preparar-env.ps1)}
      #  La agencia de cobranza no va aqui: se conecta desde el panel
      #  (pestaña Cobranza) y queda guardada en la base.

    ports:
      - "${PATRIMONIO_PORT:-3001}:3001"

    volumes:
      #  Los datos sobreviven a "docker compose down" y a reconstruir la
      #  imagen. Para partir de cero: docker compose down -v
      - patrimonio_datos:/datos

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

    deploy:
      resources:
        limits: { memory: 256M }

volumes:
  patrimonio_datos:
