name: CI

on:
  push:
  pull_request:

jobs:
  servidor:
    name: API y modulo de arriendos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Cada prueba usa su propia base temporal. La que compara con el contrato
      # de TB_web se salta aqui, porque ese repositorio no esta al lado.
      - run: npm test

  cliente:
    name: Sitio y panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
