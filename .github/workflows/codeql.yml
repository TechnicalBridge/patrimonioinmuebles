# =============================================================================
#  Analisis estatico de seguridad — CodeQL
# =============================================================================
#  Lee el codigo buscando patrones que terminan en vulnerabilidad: datos del
#  usuario que llegan sin filtrar a una consulta SQL o a la respuesta,
#  secretos escritos en el codigo, redirecciones abiertas.
#
#  Importa aca porque Patrimonio recibe avisos de pago por HTTP desde otro
#  sistema y los usa para modificar cargos.
#
#  Los hallazgos quedan en la pestana Security del repositorio, con fecha.
# =============================================================================
name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analizar:
    name: Analizar JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Preparar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analizar
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
